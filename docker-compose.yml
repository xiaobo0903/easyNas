services:
  easynas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easynas
    restart: unless-stopped
    ports:
      - "80:80"      # Web UI
      - "8080:8080"  # API
      - "445:445"    # SMB
      - "139:139"    # SMB NetBIOS
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./temp:/app/temp
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: easynas-network
