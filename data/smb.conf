[global]
   server string = EasyDown Samba Server
   server role = standalone server
   map to guest = Bad Password
   dns proxy = No
   log file = /tmp/sambad.log
   max log size = 1000
   socket options = TCP_NODELAY IPTOS_LOWDELAY

[easydown]
   path = downloads
   comment = EasyDown Download Share
   browseable = Yes
   read only = No
   create mask = 0664
   directory mask = 0775
   guest only = Yes
   guest ok = Yes
